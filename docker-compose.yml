  MEDIA_PIPELINE_MOVIE_MSG_PROVIDER: "${MEDIA_PIPELINE_MOVIE_MSG_PROVIDER:-tmdb}"
  MEDIA_PIPELINE_MOVIE_MSG_MEDIA_TYPE: "${MEDIA_PIPELINE_MOVIE_MSG_MEDIA_TYPE:-movie}"
  MEDIA_PIPELINE_TV_FOLDER_ID: "${MEDIA_PIPELINE_TV_FOLDER_ID:-3465137076394001831}"
  MEDIA_PIPELINE_TV_OPENLIST_PATH: "${MEDIA_PIPELINE_TV_OPENLIST_PATH:-/115/剧集}"
  MEDIA_PIPELINE_TV_MSG_LIBRARY_ID: "${MEDIA_PIPELINE_TV_MSG_LIBRARY_ID:-b6c58f40-76dc-46b5-8f27-9e74d22e5e3d}"
  MEDIA_PIPELINE_TV_MSG_ROOT_ID: "${MEDIA_PIPELINE_TV_MSG_ROOT_ID:-3d2e0cb4-3537-4f7d-8d79-9d4d5f1800df}"
  MEDIA_PIPELINE_TV_MSG_PROVIDER: "${MEDIA_PIPELINE_TV_MSG_PROVIDER:-tmdb}"
  MEDIA_PIPELINE_TV_MSG_MEDIA_TYPE: "${MEDIA_PIPELINE_TV_MSG_MEDIA_TYPE:-tv}"
  MEDIA_PIPELINE_ANIME_FOLDER_ID: "${MEDIA_PIPELINE_ANIME_FOLDER_ID:-3465784028030830531}"
  MEDIA_PIPELINE_ANIME_OPENLIST_PATH: "${MEDIA_PIPELINE_ANIME_OPENLIST_PATH:-/115/动漫}"
  MEDIA_PIPELINE_ANIME_MSG_LIBRARY_ID: "${MEDIA_PIPELINE_ANIME_MSG_LIBRARY_ID:-e1333358-17ff-4b90-82f0-663cec26c0df}"
  MEDIA_PIPELINE_ANIME_MSG_ROOT_ID: "${MEDIA_PIPELINE_ANIME_MSG_ROOT_ID:-fc7058d6-0b32-4536-bb92-4755c488be55}"
  MEDIA_PIPELINE_ANIME_MSG_PROVIDER: "${MEDIA_PIPELINE_ANIME_MSG_PROVIDER:-tmdb}"
  MEDIA_PIPELINE_ANIME_MSG_MEDIA_TYPE: "${MEDIA_PIPELINE_ANIME_MSG_MEDIA_TYPE:-anime}"
  MEDIA_PIPELINE_ADULT_FOLDER_ID: "${MEDIA_PIPELINE_ADULT_FOLDER_ID:-3464134590896014943}"
  MEDIA_PIPELINE_ADULT_OPENLIST_PATH: "${MEDIA_PIPELINE_ADULT_OPENLIST_PATH:-/115/成人}"
  MEDIA_PIPELINE_ADULT_MSG_LIBRARY_ID: "${MEDIA_PIPELINE_ADULT_MSG_LIBRARY_ID:-26768071-73bb-4b5c-85f3-ad0dd84f9fd9}"
  MEDIA_PIPELINE_ADULT_MSG_ROOT_ID: "${MEDIA_PIPELINE_ADULT_MSG_ROOT_ID:-3fe479e8-4a96-4e61-9f69-fa802e448446}"
  MEDIA_PIPELINE_ADULT_MSG_PROVIDER: "${MEDIA_PIPELINE_ADULT_MSG_PROVIDER:-adult}"
  MEDIA_PIPELINE_ADULT_MSG_MEDIA_TYPE: "${MEDIA_PIPELINE_ADULT_MSG_MEDIA_TYPE:-adult}"
  MEDIA_PIPELINE_OTHER_FOLDER_ID: "${MEDIA_PIPELINE_OTHER_FOLDER_ID:-3465205291639899794}"
  MEDIA_PIPELINE_OTHER_OPENLIST_PATH: "${MEDIA_PIPELINE_OTHER_OPENLIST_PATH:-/115/其他}"
  MEDIA_PIPELINE_OTHER_MSG_LIBRARY_ID: "${MEDIA_PIPELINE_OTHER_MSG_LIBRARY_ID:-60067bc7-eb34-466c-8bf9-5654297a609f}"
  MEDIA_PIPELINE_OTHER_MSG_ROOT_ID: "${MEDIA_PIPELINE_OTHER_MSG_ROOT_ID:-1f889ec1-b34d-40b6-b3ca-f4372170a42b}"
