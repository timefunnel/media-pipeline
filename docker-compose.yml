  MEDIA_PIPELINE_OTHER_MSG_MEDIA_TYPE: "${MEDIA_PIPELINE_OTHER_MSG_MEDIA_TYPE:-movie}"

services:
  media-pipeline:
    build: .
    container_name: media-pipeline
    network_mode: host
    environment:
      <<: *media-pipeline-library-env
      OPENLIST_TOKEN: "${OPENLIST_TOKEN:?OPENLIST_TOKEN missing}"
    restart: "no"
    command: ["folders"]
    volumes:
      - /data/OpenList/data:/openlist-data:ro
      - /data/Prowlarr/config:/prowlarr-config:ro

  media-pipeline-bot:
    build:
      context: .
      args:
        MEDIA_PIPELINE_VERSION: "${MEDIA_PIPELINE_VERSION:-0.1.0}"
        MEDIA_PIPELINE_REVISION: "${MEDIA_PIPELINE_REVISION:-unknown}"
    container_name: media-pipeline-bot
    network_mode: host
    environment:
      MEDIA_PIPELINE_VERSION: "${MEDIA_PIPELINE_VERSION:-0.1.0}"
      MEDIA_PIPELINE_REVISION: "${MEDIA_PIPELINE_REVISION:-unknown}"
      OPENLIST_TOKEN: "${OPENLIST_TOKEN:?OPENLIST_TOKEN missing}"
      OPENLIST_MEDIA_SCAN_USERNAME: "${OPENLIST_MEDIA_SCAN_USERNAME:?OPENLIST_MEDIA_SCAN_USERNAME missing}"
      OPENLIST_MEDIA_SCAN_PASSWORD: "${OPENLIST_MEDIA_SCAN_PASSWORD:?OPENLIST_MEDIA_SCAN_PASSWORD missing}"
      TG_BOT_TOKEN: "${TG_BOT_TOKEN:?TG_BOT_TOKEN missing}"
      TG_ALLOWED_USER_IDS: "${TG_ALLOWED_USER_IDS:-700656624}"
      <<: *media-pipeline-library-env
      BOT_STATE_DB: /bot-data/state.db
      MSG_BASE_URL: "${MSG_BASE_URL:-http://127.0.0.1:18080/api}"
      MSG_DATABASE_DSN: "${MSG_DATABASE_DSN:-postgresql://mediastation:mediastation@127.0.0.1:15432/mediastation}"
      MSG_ADMIN_USER: "${MSG_ADMIN_USER:-admin}"
      MSG_ADMIN_PASSWORD: "${MSG_ADMIN_PASSWORD:?MSG_ADMIN_PASSWORD missing}"
      MSG_ENABLED: "${MSG_ENABLED:-1}"
      MSG_SYNC_POLL_SECONDS: "${MSG_SYNC_POLL_SECONDS:-60}"
      MSG_SYNC_POLL_INTERVAL_SECONDS: "${MSG_SYNC_POLL_INTERVAL_SECONDS:-5}"
      MSG_TRASH_HIDE_SYNC_ENABLED: "${MSG_TRASH_HIDE_SYNC_ENABLED:-0}"
      MSG_TRASH_HIDE_SYNC_LIMIT: "${MSG_TRASH_HIDE_SYNC_LIMIT:-100}"
      BOT_SEARCH_LIMIT: "${BOT_SEARCH_LIMIT:-100}"
      BOT_SEARCH_PAGE_SIZE: "${BOT_SEARCH_PAGE_SIZE:-5}"
      BOT_TASK_LIST_PAGE_SIZE: "${BOT_TASK_LIST_PAGE_SIZE:-5}"
      BOT_TASK_LIST_FETCH_LIMIT: "${BOT_TASK_LIST_FETCH_LIMIT:-100}"
      TG_API_TIMEOUT: "${TG_API_TIMEOUT:-90}"
      BOT_SYNC_RECOVERY_INTERVAL_SECONDS: "${BOT_SYNC_RECOVERY_INTERVAL_SECONDS:-60}"
      BOT_TASK_WORKERS: "${BOT_TASK_WORKERS:-2}"
      BOT_TASK_MESSAGE_EDIT_MIN_INTERVAL_SECONDS: "${BOT_TASK_MESSAGE_EDIT_MIN_INTERVAL_SECONDS:-2}"
      SUBTITLE_AUTO_MATCH_ENABLED: "${SUBTITLE_AUTO_MATCH_ENABLED:-0}"
      SUBTITLE_AUTO_MATCH_ADULT_ONLY: "${SUBTITLE_AUTO_MATCH_ADULT_ONLY:-1}"
      SUBTITLE_CACHE_DIR: "${SUBTITLE_CACHE_DIR:-/subtitle-cache}"
      SUBTITLE_PROVIDERS: "${SUBTITLE_PROVIDERS:-subtitlecat,assrt,opensubtitles}"
      SUBTITLE_SEARCH_TIMEOUT_SECONDS: "${SUBTITLE_SEARCH_TIMEOUT_SECONDS:-12}"
      SUBTITLE_DOWNLOAD_MAX_BYTES: "${SUBTITLE_DOWNLOAD_MAX_BYTES:-2097152}"
      ASSRT_API_TOKEN: "${ASSRT_API_TOKEN:-}"
      OPENSUBTITLES_API_KEY: "${OPENSUBTITLES_API_KEY:-}"
      OPENSUBTITLES_USERNAME: "${OPENSUBTITLES_USERNAME:-}"
      OPENSUBTITLES_PASSWORD: "${OPENSUBTITLES_PASSWORD:-}"
      OPENLIST_PRE_SCAN_CLEAN_ENABLED: "${OPENLIST_PRE_SCAN_CLEAN_ENABLED:-1}"
      OPENLIST_PRE_SCAN_CLEAN_MAX_BYTES: "${OPENLIST_PRE_SCAN_CLEAN_MAX_BYTES:-20971520}"
      OPENLIST_ADULT_CODE_FORMAT_ENABLED: "${OPENLIST_ADULT_CODE_FORMAT_ENABLED:-1}"
      OPENLIST_DB: "${OPENLIST_DB:-/openlist-data/data.db}"
      OPENLIST_URL: "${OPENLIST_URL:-http://127.0.0.1:5244}"
      PROWLARR_URL: "${PROWLARR_URL:-http://127.0.0.1:9696}"
      PROWLARR_CONFIG: "${PROWLARR_CONFIG:-/prowlarr-config/config.xml}"
      PROWLARR_SEARCH_TIMEOUT_SECONDS: "${PROWLARR_SEARCH_TIMEOUT_SECONDS:-4}"
      PROWLARR_UPSTREAM_SEARCH_LIMIT: "${PROWLARR_UPSTREAM_SEARCH_LIMIT:-100}"
      PROWLARR_REQUIRED_INDEXER_SEARCH_LIMIT: "${PROWLARR_REQUIRED_INDEXER_SEARCH_LIMIT:-1000}"
      PROWLARR_ANIME_INDEXER_SEARCH_LIMIT: "${PROWLARR_ANIME_INDEXER_SEARCH_LIMIT:-100}"
      PROWLARR_PRIMARY_INDEXER_TIMEOUT_SECONDS: "${PROWLARR_PRIMARY_INDEXER_TIMEOUT_SECONDS:-12}"
      PROWLARR_OPTIONAL_INDEXER_TIMEOUT_SECONDS: "${PROWLARR_OPTIONAL_INDEXER_TIMEOUT_SECONDS:-12}"
      PROWLARR_MAX_WORKERS: "${PROWLARR_MAX_WORKERS:-8}"
      PROWLARR_EARLY_RETURN_AFTER_SECONDS: "${PROWLARR_EARLY_RETURN_AFTER_SECONDS:-1}"
      PROWLARR_EARLY_RETURN_MIN_RESULTS: "${PROWLARR_EARLY_RETURN_MIN_RESULTS:-50}"
      PROWLARR_EARLY_RETURN_REQUIRED_PRIORITY: "${PROWLARR_EARLY_RETURN_REQUIRED_PRIORITY:-10}"
      PROWLARR_PROFILE_GENERAL_UPSTREAM_LIMIT: "${PROWLARR_PROFILE_GENERAL_UPSTREAM_LIMIT:-100}"
      PROWLARR_PROFILE_ADULT_UPSTREAM_LIMIT: "${PROWLARR_PROFILE_ADULT_UPSTREAM_LIMIT:-100}"
      PROWLARR_PROFILE_ANIME_UPSTREAM_LIMIT: "${PROWLARR_PROFILE_ANIME_UPSTREAM_LIMIT:-100}"
      PROWLARR_PROFILE_GENERAL_TIMEOUT_SECONDS: "${PROWLARR_PROFILE_GENERAL_TIMEOUT_SECONDS:-4}"
      PROWLARR_PROFILE_ADULT_TIMEOUT_SECONDS: "${PROWLARR_PROFILE_ADULT_TIMEOUT_SECONDS:-4}"
      PROWLARR_PROFILE_ANIME_TIMEOUT_SECONDS: "${PROWLARR_PROFILE_ANIME_TIMEOUT_SECONDS:-4}"
      PROWLARR_PROFILE_GENERAL_MAX_WORKERS: "${PROWLARR_PROFILE_GENERAL_MAX_WORKERS:-8}"
      PROWLARR_PROFILE_ADULT_MAX_WORKERS: "${PROWLARR_PROFILE_ADULT_MAX_WORKERS:-8}"
      PROWLARR_PROFILE_ANIME_MAX_WORKERS: "${PROWLARR_PROFILE_ANIME_MAX_WORKERS:-8}"
      PROWLARR_PROFILE_GENERAL_CATEGORIES: "${PROWLARR_PROFILE_GENERAL_CATEGORIES:-2000,5000}"
      PROWLARR_PROFILE_ADULT_CATEGORIES: "${PROWLARR_PROFILE_ADULT_CATEGORIES:-6000}"
      PROWLARR_PROFILE_ANIME_CATEGORIES: "${PROWLARR_PROFILE_ANIME_CATEGORIES:-2000,5000}"
      PROWLARR_PROFILE_GENERAL_TAG_LABELS: "${PROWLARR_PROFILE_GENERAL_TAG_LABELS:-media-general,general}"
      PROWLARR_PROFILE_ADULT_TAG_LABELS: "${PROWLARR_PROFILE_ADULT_TAG_LABELS:-media-adult,adult}"
      PROWLARR_PROFILE_ANIME_TAG_LABELS: "${PROWLARR_PROFILE_ANIME_TAG_LABELS:-media-anime,anime}"
      LLM_SEARCH_RERANK_ENABLED: "${LLM_SEARCH_RERANK_ENABLED:-0}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-v4-flash}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-4}"
      LLM_SEARCH_RERANK_LIMIT: "${LLM_SEARCH_RERANK_LIMIT:-40}"
      LLM_THINKING_DISABLED: "${LLM_THINKING_DISABLED:-1}"
    restart: unless-stopped
    command: ["bot"]
    volumes:
      - /data/OpenList/data:/openlist-data:ro
      - /data/Prowlarr/config:/prowlarr-config:ro
      - /data/media-pipeline/bot:/bot-data
      - /data/media-pipeline/subtitles:/subtitle-cache

  media-pipeline-subtitle-proxy:
    build:
      context: .
      args:
        MEDIA_PIPELINE_VERSION: "${MEDIA_PIPELINE_VERSION:-0.1.0}"
        MEDIA_PIPELINE_REVISION: "${MEDIA_PIPELINE_REVISION:-unknown}"
    container_name: media-pipeline-subtitle-proxy
    network_mode: host
    environment:
      MSG_SUBTITLE_PROXY_HOST: "${MSG_SUBTITLE_PROXY_HOST:-127.0.0.1}"
      MSG_SUBTITLE_PROXY_PORT: "${MSG_SUBTITLE_PROXY_PORT:-18081}"
      MSG_SUBTITLE_PROXY_UPSTREAM: "${MSG_SUBTITLE_PROXY_UPSTREAM:-http://127.0.0.1:18080}"
      OPENLIST_URL: "${OPENLIST_URL:-http://127.0.0.1:5244}"
      OPENLIST_MEDIA_SCAN_USERNAME: "${OPENLIST_MEDIA_SCAN_USERNAME:?OPENLIST_MEDIA_SCAN_USERNAME missing}"
      OPENLIST_MEDIA_SCAN_PASSWORD: "${OPENLIST_MEDIA_SCAN_PASSWORD:?OPENLIST_MEDIA_SCAN_PASSWORD missing}"
      MSG_BASE_URL: "${MSG_BASE_URL:-http://127.0.0.1:18080/api}"
      MSG_ADMIN_USER: "${MSG_ADMIN_USER:-admin}"
      MSG_ADMIN_PASSWORD: "${MSG_ADMIN_PASSWORD:?MSG_ADMIN_PASSWORD missing}"
      SUBTITLE_CACHE_DIR: "${SUBTITLE_CACHE_DIR:-/subtitle-cache}"
    restart: unless-stopped
    command: ["subtitle-proxy"]
    volumes:
      - /data/media-pipeline/subtitles:/subtitle-cache
