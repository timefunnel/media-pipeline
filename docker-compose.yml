  MEDIA_PIPELINE_LIBRARY_CONFIG_JSON: "${MEDIA_PIPELINE_LIBRARY_CONFIG_JSON:-}"
  MEDIA_PIPELINE_MOVIE_FOLDER_ID: "${MEDIA_PIPELINE_MOVIE_FOLDER_ID:-3464134653584082023}"
  MEDIA_PIPELINE_MOVIE_OPENLIST_PATH: "${MEDIA_PIPELINE_MOVIE_OPENLIST_PATH:-/115/电影}"
  MEDIA_PIPELINE_MOVIE_MSG_LIBRARY_ID: "${MEDIA_PIPELINE_MOVIE_MSG_LIBRARY_ID:-d150a96c-b467-4c60-82f1-207ae5949045}"
